<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Deep Institutional Navy) -->
    <linearGradient id="vfBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08203e" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <!-- Left Arm Gradient (Cyan to Fintech Blue) -->
    <linearGradient id="vfLeft" x1="16" y1="18" x2="33" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Right Arm Gradient (Emerald Verified Checkmark) -->
    <linearGradient id="vfRight" x1="28" y1="47" x2="48" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Subtle Outer Border Glow -->
    <linearGradient id="vfBorder" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8" />
    </linearGradient>

    <filter id="vfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#10B981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#vfBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#vfBorder)" stroke-width="1.5" />

  <!-- Subtle Inner Shield Watermark -->
  <path d="M32 9 L49 16.5 C49 30 42 42 32 48 C22 42 15 30 15 16.5 Z" fill="#0B172E" fill-opacity="0.7" stroke="#1E293B" stroke-width="1" />

  <!-- Geometric V with Integrated Verification Tick -->
  <!-- Left Wing (Cyan) -->
  <path d="M19.5 20.5 L32 46.5 L26 46.5 L14.5 20.5 Z" fill="url(#vfLeft)" />

  <!-- Right Wing / Ascending Proof Tick (Emerald) -->
  <path d="M26 46.5 L49.5 17.5 L43.5 17.5 L29 40 L26 46.5 Z" fill="url(#vfRight)" filter="url(#vfGlow)" />

  <!-- Precision Anchor Nodes -->
  <circle cx="32" cy="46" r="3" fill="#38BDF8" />
  <circle cx="49.5" cy="17.5" r="2.5" fill="#34D399" />
  <circle cx="14.5" cy="20.5" r="2.5" fill="#38BDF8" />
</svg>
